services:
  brain:
    build:
      context: ..
      dockerfile: personal-node/Dockerfile
    env_file: ../.env.personal
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - brain:/data/brain
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  brain:
